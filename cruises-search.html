<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пошук круїзів</title>
<style>
  /* ============ ТЕМА: міняйте тільки ці змінні ============ */
  :root {
    --accent: #0a6ebd;        /* головний колір (кнопки, активні елементи) */
    --accent-hover: #085a9c;
    --bg: #f4f7fa;            /* фон сторінки */
    --card: #ffffff;          /* фон блоку пошуку */
    --text: #1d2733;
    --muted: #6b7a8a;
    --border: #d5dde6;
    --radius: 10px;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.5;
  }
  .page { max-width: 1200px; margin: 0 auto; padding: 32px 16px 64px; }
  .page h1 { font-size: clamp(24px, 4vw, 34px); margin: 0 0 6px; }
  .page p.lead { margin: 0 0 24px; color: var(--muted); }

  /* ============ СТИЛІЗАЦІЯ МОДУЛЯ ============
     Класи модуля постачальника заздалегідь невідомі, тому стилі
     навішені на загальні теги всередині контейнера. Після огляду
     DOM (F12) їх можна уточнити під конкретні класи. */
  #search_cruises_blocks {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 4px 18px rgba(20, 40, 70, .06);
    font-family: var(--font) !important;
    color: var(--text) !important;
  }
  #search_cruises_blocks * { font-family: inherit; }

  #search_cruises_blocks label { color: var(--muted) !important; font-size: 13px; }

  #search_cruises_blocks input[type="text"],
  #search_cruises_blocks input[type="search"],
  #search_cruises_blocks input[type="number"],
  #search_cruises_blocks input[type="date"],
  #search_cruises_blocks select,
  #search_cruises_blocks textarea {
    border: 1px solid var(--border) !important;
    border-radius: 8px !important;
    padding: 9px 12px !important;
    background: #fff !important;
    color: var(--text) !important;
    font-size: 14px !important;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #search_cruises_blocks input:focus,
  #search_cruises_blocks select:focus {
    border-color: var(--accent) !important;
    box-shadow: 0 0 0 3px rgba(10, 110, 189, .15);
  }

  #search_cruises_blocks button,
  #search_cruises_blocks input[type="submit"],
  #search_cruises_blocks input[type="button"],
  #search_cruises_blocks .btn,
  #search_cruises_blocks [class*="button"],
  #search_cruises_blocks [class*="btn"] {
    background: var(--accent) !important;
    border-color: var(--accent) !important;
    color: #fff !important;
    border-radius: 8px !important;
    cursor: pointer;
    transition: background .15s;
  }
  #search_cruises_blocks button:hover,
  #search_cruises_blocks input[type="submit"]:hover,
  #search_cruises_blocks [class*="btn"]:hover {
    background: var(--accent-hover) !important;
  }

  #search_cruises_blocks a { color: var(--accent); }
  #search_cruises_blocks table { width: 100%; border-collapse: collapse; }
  #search_cruises_blocks th { color: var(--muted); font-weight: 600; text-align: left; }
  #search_cruises_blocks td,
  #search_cruises_blocks th { border-bottom: 1px solid var(--border); padding: 10px 8px; }
  #search_cruises_blocks img { max-width: 100%; height: auto; }

  @media (max-width: 640px) {
    #search_cruises_blocks { padding: 12px; }
    #search_cruises_blocks select,
    #search_cruises_blocks input[type="text"] { width: 100% !important; }
  }
</style>
</head>
<body>
  <main class="page">
    <h1>Пошук круїзів</h1>
    <p class="lead">Оберіть напрямок, дати та круїзну лінію.</p>

    <!-- Код модуля від постачальника (без змін) -->
    <div id="search_cruises_blocks"></div>
    <script type="text/javascript">
      var AGENTID = '06138bc5af6023646ede0e1f7c1eac75';
      var FIRST_MODULE = 'cruises';
      var DEF_VALUTA = 'NAT';
      var LOCALE = 'ua';
    </script>
    <script src="https://4gates.cruises/search_agent/js/search_agent.js" type="text/javascript"></script>
  </main>
</body>
</html>
